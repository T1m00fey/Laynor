<svg xmlns="http://www.w3.org/2000/svg" width="6600" height="2868" viewBox="0 0 6600 2868">
  <defs>
    <radialGradient id="ambientOne">
      <stop offset="0" stop-color="#D9D9FF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#D9D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientTwo">
      <stop offset="0" stop-color="#E2DDFF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#E2DDFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientThree">
      <stop offset="0" stop-color="#DFF0FF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#DFF0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientFour">
      <stop offset="0" stop-color="#D7D8FF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#D7D8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientFive">
      <stop offset="0" stop-color="#D8EDFF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#D8EDFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="6600" height="2868" fill="#F8F8FB"/>

  <!-- Screen 1: indigo glow at the upper-right, exactly like .ambient-one. -->
  <ellipse cx="1109" cy="330" rx="607" ry="617" fill="url(#ambientOne)"/>

  <!-- Screen 2: violet glow entering from the lower-left, like .ambient-two. -->
  <ellipse cx="1518" cy="1850" rx="726" ry="674" fill="url(#ambientTwo)"/>

  <!-- Screen 3: cool blue highlight at the right-center, like .ambient-three. -->
  <ellipse cx="3762" cy="1291" rx="594" ry="545" fill="url(#ambientThree)"/>

  <!-- Screen 4: indigo glow entering from the upper-left, like .ambient-four. -->
  <ellipse cx="4290" cy="602" rx="660" ry="602" fill="url(#ambientFour)"/>

  <!-- Screen 5: blue glow at the lower-right, like .ambient-five. -->
  <ellipse cx="6270" cy="2180" rx="726" ry="688" fill="url(#ambientFive)"/>
</svg>
